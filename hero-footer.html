<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فوتر آماری</title>
<style>
  @font-face {
    font-family: 'Vazirmatn';
    src: local('Vazirmatn');
  }

  :root{
    --bg: #171512;
    --bg-2: #1d1a16;
    --gold: #c9a06a;
    --gold-bright: #d9b27f;
    --text-soft: #cfc9c0;
    --text-dim: #a89f92;
    --divider: rgba(201,160,106,0.28);
  }

  *{ box-sizing: border-box; }

  html, body{
    margin: 0;
    padding: 0;
    background: #0f0e0c;
    font-family: 'Vazirmatn', 'Tahoma', sans-serif;
  }

  .stats-footer{
    direction: rtl;
    background: linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
    padding: 56px 40px;
    color: var(--text-soft);
  }

  .stats-grid{
    max-width: 1200px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
  }

  .stat-col{
    position: relative;
    padding: 0 32px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    opacity: 0;
    transform: translateY(14px);
    animation: rise 0.6s ease forwards;
  }

  .stat-col:nth-child(1){ animation-delay: .05s; }
  .stat-col:nth-child(2){ animation-delay: .15s; }
  .stat-col:nth-child(3){ animation-delay: .25s; }
  .stat-col:nth-child(4){ animation-delay: .35s; }

  @keyframes rise{
    to{ opacity: 1; transform: translateY(0); }
  }

  .stat-col + .stat-col::before{
    content: "";
    position: absolute;
    right: 0;
    top: 6px;
    bottom: 6px;
    width: 1px;
    background: var(--divider);
  }

  .stat-head{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }

  .stat-icon{
    width: 26px;
    height: 26px;
    flex-shrink: 0;
    color: var(--gold-bright);
  }
  .stat-icon svg{
    width: 100%;
    height: 100%;
    display: block;
  }

  .stat-label{
    font-size: 15px;
    color: var(--text-soft);
    white-space: nowrap;
    letter-spacing: 0.2px;
  }

  .stat-number{
    font-size: 44px;
    font-weight: 700;
    color: var(--gold-bright);
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }

  .stat-caption{
    font-size: 14px;
    color: var(--text-dim);
  }

  @media (max-width: 860px){
    .stats-grid{
      grid-template-columns: repeat(2, 1fr);
      row-gap: 40px;
    }
    .stat-col:nth-child(1)::before,
    .stat-col:nth-child(3)::before{
      display: none;
    }
    .stat-col:nth-child(3)::after,
    .stat-col:nth-child(4)::after{
      content: "";
      position: absolute;
      top: -20px;
      right: 20%;
      left: 20%;
      height: 1px;
      background: var(--divider);
    }
  }

  @media (max-width: 480px){
    .stats-footer{ padding: 40px 20px; }
    .stats-grid{ grid-template-columns: 1fr; row-gap: 34px; }
    .stat-col::before{ display: none !important; }
    .stat-col::after{ display: none !important; }
    .stat-col:not(:first-child){
      padding-top: 28px;
    }
    .stat-col:not(:first-child)::before{
      content: "";
      display: block !important;
      position: absolute;
      top: 0;
      right: 25%;
      left: 25%;
      width: auto;
      height: 1px;
      background: var(--divider);
    }
  }

  @media (prefers-reduced-motion: reduce){
    .stat-col{
      animation: none;
      opacity: 1;
      transform: none;
    }
  }
</style>
</head>
<body>

<footer class="stats-footer">
  <div class="stats-grid">

    <!-- Column 1: Successful cases (bag icon) -->
    <div class="stat-col">
      <div class="stat-head">
        <span class="stat-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M9 7V5.5C9 4.67 9.67 4 10.5 4h3c.83 0 1.5.67 1.5 1.5V7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            <rect x="3.5" y="7" width="17" height="12" rx="2" stroke="currentColor" stroke-width="1.6"/>
            <path d="M3.5 12.5c2.4 1.3 5.4 2 8.5 2s6.1-.7 8.5-2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            <path d="M11 12.5h2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="stat-label">موفقیت در پرونده‌ها</span>
      </div>
      <div class="stat-number">۱۵۰+</div>
      <div class="stat-caption">پرونده موفق</div>
    </div>

    <!-- Column 2: Success rate (dart icon) -->
    <div class="stat-col">
      <div class="stat-head">
        <span class="stat-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.6"/>
            <circle cx="12" cy="12" r="5" stroke="currentColor" stroke-width="1.6"/>
            <circle cx="12" cy="12" r="1.6" fill="currentColor"/>
          </svg>
        </span>
        <span class="stat-label">نرخ موفقیت</span>
      </div>
      <div class="stat-number">۹۶٪</div>
      <div class="stat-caption">رضایت موکلین</div>
    </div>

    <!-- Column 3: Cases handled (3 people icon) -->
    <div class="stat-col">
      <div class="stat-head">
        <span class="stat-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="7.2" r="2.4" stroke="currentColor" stroke-width="1.6"/>
            <path d="M7.2 19v-1.5c0-2.2 2.1-3.5 4.8-3.5s4.8 1.3 4.8 3.5V19" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            <circle cx="4.6" cy="9" r="1.8" stroke="currentColor" stroke-width="1.4"/>
            <path d="M1.5 18v-1.1c0-1.6 1.4-2.5 3.1-2.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            <circle cx="19.4" cy="9" r="1.8" stroke="currentColor" stroke-width="1.4"/>
            <path d="M22.5 18v-1.1c0-1.6-1.4-2.5-3.1-2.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="stat-label">پرونده‌های رسیدگی شده</span>
      </div>
      <div class="stat-number">۵۰۰+</div>
      <div class="stat-caption">پرونده</div>
    </div>

    <!-- Column 4: Years of activity (badge icon) -->
    <div class="stat-col">
      <div class="stat-head">
        <span class="stat-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="9" r="5.2" stroke="currentColor" stroke-width="1.6"/>
            <path d="M9.2 13.3 8 20l4-2 4 2-1.2-6.7" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
            <path d="M9.7 9.1 11 10.4l3-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="stat-label">سابقه فعالیت</span>
      </div>
      <div class="stat-number">۲۰+</div>
      <div class="stat-caption">سال تجربه کاری</div>
    </div>

  </div>
</footer>

</body>
</html>
